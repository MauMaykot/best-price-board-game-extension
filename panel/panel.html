<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melhor Compra de Boardgames</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <header>
    <h1 data-i18n="title"></h1>
    <span class="byline"><span data-i18n="byline"></span> <a href="https://github.com/MauMaykot" target="_blank" rel="noreferrer">Maurício Maykot</a></span>
    <button id="color-toggle" type="button">
      <svg id="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"></path>
      </svg>
      <svg id="icon-sun" viewBox="0 0 24 24" aria-hidden="true" hidden>
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3 7 7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"></path>
      </svg>
    </button>
  </header>

  <form id="search-form">
    <details id="setup" open>
      <summary class="step-title" tabindex="-1"><span>1.</span> <b data-i18n="setupTitle"></b> <small id="setup-info"></small></summary>
      <label for="zip-code" data-i18n="zipLabel"></label>
    <input id="zip-code" inputmode="numeric" autocomplete="off" placeholder="00000-000" maxlength="9">

    <label for="game-input" data-i18n="gameLabel"></label>
    <input id="game-input" autocomplete="off" data-i18n-placeholder="gamePlaceholder">
    <ul id="suggestions" hidden></ul>

    <ul id="games"></ul>
    <p id="games-empty" class="hint" data-i18n="gamesEmpty"></p>
    <button id="refresh-tabs" type="button" data-i18n="refreshTabs"></button>
    </details>

    <h2 class="step-title"><span>2.</span> <b data-i18n="searchTitle"></b></h2>
    <fieldset id="payment-mode">
      <legend data-i18n="paymentLegend"></legend>
      <label><input type="radio" name="payment-mode" value="cash" checked> <b data-i18n="payCash"></b></label>
      <label><input type="radio" name="payment-mode" value="installment"> <b data-i18n="payInstallment"></b></label>
    </fieldset>

    <button id="run" type="submit">
      <span id="turn-dice"></span>
      <span id="run-label" data-i18n="run"></span>
    </button>
    <button id="cancel" type="button" data-i18n="cancelSearch" hidden></button>
  </form>

  <p id="status" role="status" hidden></p>

  <h2 id="end-title" class="step-title" hidden><span>3.</span> <b data-i18n="resultTitle"></b></h2>

  <details id="coupons" hidden>
    <summary data-i18n="couponSummary"></summary>
    <form id="coupon-form">
      <label for="coupon-store" data-i18n="couponStore"></label>
      <select id="coupon-store"></select>
      <label for="coupon-code" data-i18n="couponCode"></label>
      <input id="coupon-code" autocomplete="off" data-i18n-placeholder="couponCodePlaceholder">
      <label for="coupon-value" data-i18n="couponDiscount"></label>
      <div class="coupon-amount">
        <input id="coupon-value" inputmode="decimal" autocomplete="off" placeholder="0">
        <select id="coupon-type" data-i18n-aria-label="couponType">
          <option value="percent">%</option>
          <option value="fixed">R$</option>
        </select>
      </div>
      <button id="apply-coupon" type="submit" data-i18n="couponApply"></button>
    </form>
    <ul id="coupon-list"></ul>
    <p class="hint" data-i18n="couponHint"></p>
  </details>

  <section id="results" aria-live="polite"></section>

  <script type="module" src="panel.js"></script>
</body>
</html>
